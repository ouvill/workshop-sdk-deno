name: ouvill-deno
adopt-info: deno
summary: Deno runtime for secure JavaScript and TypeScript development
description: |
  This SDK provides the Deno runtime for secure JavaScript and TypeScript
  development within a workshop. The Deno module cache and user configuration
  are persisted across workshop updates.
license: GPL-3.0-only
platforms:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:

plugs:
  deno-cache:
    interface: mount
    workshop-target: /home/workshop/.cache/deno
  deno-data:
    interface: mount
    workshop-target: /home/workshop/.deno

parts:
  deno:
    plugin: dump
    source: .
    build-packages: [curl, unzip]
    override-pull: |
      set -euo pipefail
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"

      BINARY="deno-x86_64-unknown-linux-gnu.zip"
      BASE_URL="https://github.com/denoland/deno/releases/download/v${VERSION}"

      curl -fLO "${BASE_URL}/${BINARY}"
      curl -fLO "${BASE_URL}/${BINARY}.sha256sum"

      sha256sum -c "${BINARY}.sha256sum"

      unzip -o "${BINARY}" -d "$CRAFT_PART_SRC"
      rm -f "${BINARY}" "${BINARY}.sha256sum"
    organize:
      deno: usr/bin/deno
